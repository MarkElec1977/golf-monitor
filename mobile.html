<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Launch Monitor - Sensor Móvil (Apaisado)</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; color: #fff; font-family: 'Arial', sans-serif; overflow: hidden; display: flex; flex-direction: row; }
        
        /* ALERTA DE ORIENTACIÓN: Solo desaparece si el móvil está en horizontal */
        #portrait-warning { display: none; position: absolute; top:0; left:0; width: 100vw; height: 100vh; background: #c0392b; z-index: 9999; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; text-align: center; padding: 20px; flex-direction: column; box-sizing: border-box;}
        @media screen and (orientation: portrait) {
            #portrait-warning { display: flex; }
        }

        /* Cámara a pantalla completa */
        #camera-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; background: #111; }
        #video-preview { width: 100%; height: 100%; object-fit: cover; }
        
        /* Panel de Controles Lateral (Derecha) */
        #controls-overlay { position: absolute; top: 0; right: 0; width: 320px; height: 100vh; background: rgba(20, 20, 20, 0.85); z-index: 2; padding: 25px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; border-left: 2px solid #444; backdrop-filter: blur(5px);}
        
        h2 { margin: 0 0 20px 0; font-size: 18px; color: #f39c12; text-align: center; text-transform: uppercase;}
        input[type="text"] { background: #222; color: #0f0; border: 1px solid #555; padding: 12px; border-radius: 6px; font-size: 14px; width: 100%; box-sizing: border-box; text-align: center; margin-bottom: 15px;}
        button { background: #3498db; color: white; border: none; padding: 15px; font-size: 16px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; text-transform: uppercase; margin-bottom: 20px; }
        button:active { background: #2980b9; }

        /* Estado del sistema */
        #status-box { background: rgba(0,0,0,0.5); padding: 15px; border-radius: 8px; border-left: 4px solid #7f8c8d; }
        #status-box.active { border-left-color: #f39c12; }
        #status-box.aligned { border-left-color: #2ecc71; }
        .status-title { font-size: 12px; color: #aaa; margin-bottom: 5px; text-transform: uppercase;}
        .status-msg { font-size: 15px; font-weight: bold; }

        #hidden-canvas { display: none; }
    </style>
</head>
<body>

    <!-- Bloqueo Vertical -->
    <div id="portrait-warning">
        <svg fill="#fff" height="60px" width="60px" viewBox="0 0 24 24" style="margin-bottom:20px; transform: rotate(90deg);"><path d="M16 1H8C6.34 1 5 2.34 5 4v16c0 1.66 1.34 3 3 3h8c1.66 0 3-1.34 3-3V4c0-1.66-1.34-3-3-3zm1 17H7V4h10v14z"/></svg>
        <div>Por favor, gira el móvil.<br><span style="font-size:16px; font-weight:normal;">El Launch Monitor solo funciona en horizontal.</span></div>
    </div>

    <!-- Visor -->
    <div id="camera-container">
        <video id="video-preview" autoplay playsinline muted></video>
        <canvas id="hidden-canvas"></canvas>
    </div>

    <!-- Controles -->
    <div id="controls-overlay">
        <h2>Sensor Óptico</h2>
        <input type="text" id="api-url" placeholder="URL Cloudflare">
        <button id="btn-conectar" onclick="iniciarSensor()">Conectar y Esperar</button>
        
        <div id="status-box">
            <div class="status-title">Estado del Sistema</div>
            <div class="status-msg" id="status-text">Desconectado</div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video-preview');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d');
        let baseUrl = "";
        let isConnected = false;

        async function iniciarSensor() {
            baseUrl = document.getElementById('api-url').value.trim();
            if (!baseUrl) { alert("Introduce la URL."); return; }

            try {
                // Pedir cámara forzando el formato apaisado
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } } 
                });
                video.srcObject = stream;
                
                document.getElementById('status-box').className = "active";
                document.getElementById('status-text').innerText = "Esperando órdenes del PC...";
                document.getElementById('btn-conectar').innerText = "Cámara Activa";
                document.getElementById('btn-conectar').style.background = "#27ae60";
                
                isConnected = true;

                // El móvil pregunta a la IA qué debe hacer cada 1 segundo
                setInterval(consultarEstadoYActuar, 1000);

            } catch (err) {
                alert("Error de cámara. Recuerda usar HTTPS.");
            }
        }

        async function consultarEstadoYActuar() {
            if (!isConnected || !baseUrl) return;

            try {
                const response = await fetch(`${baseUrl}/api/v1/estado`);
                const state = await response.json();

                // Si el PC ha pulsado "Iniciar Búsqueda", empezamos a hacer fotos
                if (state.fase_actual === 'setup') {
                    if (state.fiduciales_ok) {
                        document.getElementById('status-box').className = "aligned";
                        document.getElementById('status-text').innerText = "ALINEACIÓN CONFIRMADA";
                    } else {
                        document.getElementById('status-box').className = "active";
                        document.getElementById('status-text').innerText = "Transmitiendo vídeo...";
                        enviarFrameAlineacion();
                    }
                } 
                // Si el PC está en otra fase, no mandamos fotos (Ahorro de batería)
                else if (state.fase_actual === 'standby') {
                    document.getElementById('status-box').className = "active";
                    document.getElementById('status-text').innerText = "En reposo. Esperando al PC.";
                }
                else if (state.fase_actual === 'calibracion') {
                    document.getElementById('status-box').className = "active";
                    document.getElementById('status-text').innerText = "Modo Tarado (Gatillo Visual)";
                }
            } catch (err) {
                console.log("Error consultando estado", err);
            }
        }

        function enviarFrameAlineacion() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('imagen', blob, 'frame.jpg');

                try {
                    await fetch(`${baseUrl}/api/v1/alineacion`, { method: 'POST', body: formData });
                } catch (err) {}
            }, 'image/jpeg', 0.6);
        }
    </script>
</body>
</html>
